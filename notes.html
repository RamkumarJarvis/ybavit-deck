<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YBAVIT Presenter Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { color-scheme: dark; --bg: #07090d; --surface: #151a22; --text: #ece6da; --text-2: rgb(236 230 218 / .72); --accent: #f2b35b; --accent-ink: #1a1206; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding: 1.5rem; background: var(--bg); color: var(--text); font-family: 'Archivo', Arial, sans-serif; display: grid; gap: 1.25rem; align-content: start; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: .875rem; }
  #head { color: var(--accent); }
  #note { font-size: clamp(1.5rem, 1rem + 2vw, 2.5rem); line-height: 1.25; max-width: 40ch; }
  #next { color: var(--text-2); font-size: 1.125rem; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
  button { font: inherit; min-height: 48px; padding: 0 1.25rem; border-radius: 2px; border: 1px solid rgb(236 230 218 / .4); background: transparent; color: var(--text); cursor: pointer; }
  button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #clock { font-size: 2rem; }
</style>
</head>
<body>
  <p class="mono" id="head">Waiting for the deck. Start Present mode in the other window.</p>
  <p id="note"></p>
  <p id="next"></p>
  <div class="row"><button type="button" id="prev">← Back</button><button type="button" class="go" id="nextBtn">Next →</button><span class="mono" id="clock">00:00</span><span class="mono" id="target"></span></div>
  <p class="mono" style="color: var(--text-2)">This window stays in step with the deck over this browser’s own channel; both must be open in the same browser profile on this computer.</p>
<script>
  const ch = 'BroadcastChannel' in window ? new BroadcastChannel('ybavit-deck') : null;
  const $ = (id) => document.getElementById(id);
  let elapsed = 0, at = Date.now();
  const two = (n) => String(n).padStart(2, '0');
  if (ch) {
    ch.onmessage = (e) => { const m = e.data || {}; if (m.type !== 'state') return; $('head').textContent = m.head; $('note').textContent = m.note; $('next').textContent = 'Next: ' + m.next; $('target').textContent = 'Viewing for: ' + m.target; elapsed = m.elapsed; at = Date.now(); };
    ch.postMessage({ cmd: 'hello' });
  } else $('head').textContent = 'This browser cannot link the two windows. Use S in the deck to show notes on the same screen.';
  $('nextBtn').onclick = () => ch?.postMessage({ cmd: 'next' });
  $('prev').onclick = () => ch?.postMessage({ cmd: 'prev' });
  addEventListener('keydown', (e) => { if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); ch?.postMessage({ cmd: 'next' }); } if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); ch?.postMessage({ cmd: 'prev' }); } });
  setInterval(() => { const s = Math.floor((elapsed + Date.now() - at) / 1000); $('clock').textContent = `${two(Math.floor(s / 60))}:${two(s % 60)}`; }, 1000);
</script>
</body>
</html>
